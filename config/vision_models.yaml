        accepts_pdf: true
        status: "active"
        notes: "VALIDATED - Balanced performance"
        cost_per_1m_input: 0.30
        cost_per_1m_output: 2.50

      # Gemini 2.0 Series - WORKING
      - id: "gemini-2.0-flash"
        name: "Gemini 2.0 Flash"
        tier: "standard"
        speed: "fast"
        context_window: 1000000
        vision: true
        accepts_pdf: true
        status: "deprecated"
        replaced_by: "gemini-2.5-flash"
        notes: "VALIDATED - GA model (shutdown announced for 2026-03-31; use 2.5+ or 3 Flash Preview)"
