# Vision Models Reference
# ======================
# Catalog of vision-capable models across providers for benchmarking
# The 'id' field is the exact string to send to the API
# VALIDATED: 2026-01-09 - Models marked "VALIDATED" in notes have been tested and work; status reflects provider lifecycle
# Last Updated: 2026-06-01
# accepts_pdf: true/false - Whether the API can accept a PDF input for this model (pages are parsed to text + rendered page images when supported)
# PDF input notes (see provider docs for exact limits and pricing details):
# - OpenAI: PDF pages are parsed into extracted text + rendered page images for vision models (via file inputs).
# - Anthropic: PDFs supported as document inputs (base64); limits include max file size and page count.
# - Google Gemini: PDFs supported for document processing; per-file limits and per-page token accounting apply.

providers:
  google:
    name: "Google (Gemini)"
    env_key: "GOOGLE_API_KEY"
    models:
      # Gemini 3.1 Series (Preview) - Released 2026-02-19
      - id: "gemini-3.1-pro-preview"
        name: "Gemini 3.1 Pro Preview"
        tier: "frontier"
        speed: "medium"
        context_window: 1000000
        max_output: 64000
        vision: true
        accepts_pdf: true
        status: "active"
        notes: "Latest Gemini - natively multimodal, 2x reasoning boost over 3.0. Needs validation"
        cost_per_1m_input: 2.00
        cost_per_1m_output: 12.00

      # Gemini 3 Series (Preview) - VALIDATED WORKING
      - id: "gemini-3-pro-preview"
        name: "Gemini 3 Pro Preview"
        tier: "frontier"
        speed: "medium"
        context_window: 1000000
        vision: true
        accepts_pdf: true
        status: "active"
        notes: "VALIDATED - Cutting-edge multimodal understanding (text pricing aligned with Gemini 3 Pro; see pricing page for Pro Image Preview reference)"
        cost_per_1m_input: 2.00
        cost_per_1m_output: 12.00

      - id: "gemini-3-flash-preview"
        name: "Gemini 3 Flash Preview"
        tier: "standard"
        speed: "fast"
        context_window: 1000000
        vision: true
        accepts_pdf: true
        status: "active"
        notes: "VALIDATED - Fast/cheap - good for OCR tasks"
        cost_per_1m_input: 0.50
        cost_per_1m_output: 3.00

      # App-specific image generation model (used by task_assignments.meme_generation)
