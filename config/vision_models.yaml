# Groups prioritize validated models; status reflects lifecycle and may include deprecated-but-still-available models
benchmark_groups:
  # Economy tier - cheapest models for high-volume tasks
  economy_tier:
    description: "Cheapest validated models for high-volume tasks"
    models:
      - "gemini-2.0-flash-lite"
      - "gpt-4o-mini"
      - "gpt-4.1-nano"
      - "claude-haiku-4-5-20251001"

  # Standard tier - balanced cost/performance
  standard_tier:
    description: "Balanced cost/performance validated models"
    models:
      - "gemini-2.5-flash"
      - "gpt-4o"
      - "claude-sonnet-4-6"

  # Frontier tier - highest capability
  frontier_tier:
    description: "Highest capability validated models"
    models:
      - "gpt-5.5"
      - "gpt-5.5-pro"
      - "claude-opus-4-8"
      - "gemini-3.1-pro-preview"

  # OpenAI comparison - all tiers
  openai_versions:
    description: "Compare OpenAI model generations"
    models:
      - "gpt-5.5"
      - "gpt-5.5-pro"
      - "gpt-5-mini"
      - "gpt-4.1"
      - "gpt-4o"
      - "gpt-4o-mini"

  # OpenAI economy options
  openai_economy:
    description: "Compare OpenAI economy models"
    models:
      - "gpt-5-mini"
      - "gpt-4.1-nano"
      - "gpt-4o-mini"

  # Claude comparison
  claude_versions:
    description: "Compare Claude model tiers"
    models:
      - "claude-opus-4-8"
      - "claude-sonnet-4-6"
      - "claude-haiku-4-5-20251001"

  # Gemini comparison - all versions
  gemini_versions:
    description: "Compare Gemini model generations"
    models:
      - "gemini-3.1-pro-preview"
      - "gemini-3-pro-preview"
      - "gemini-3-flash-preview"
      - "gemini-2.5-pro"
      - "gemini-2.5-flash"
      - "gemini-2.0-flash"
      - "gemini-2.0-flash-lite"

  # Gemini Flash comparison
  gemini_flash_versions:
    description: "Compare Gemini Flash models (3 vs 2.5 vs 2.0)"
    models:
      - "gemini-3-flash-preview"
      - "gemini-2.5-flash"
      - "gemini-2.0-flash"

  # Gemini Pro comparison
  gemini_pro_versions:
    description: "Compare Gemini Pro models"
    models:
      - "gemini-3.1-pro-preview"
      - "gemini-3-pro-preview"
      - "gemini-2.5-pro"

  # Default for classification benchmarks
  classification_default:
    description: "Recommended validated models for document classification"
    models:
      - "gemini-2.5-flash"
      - "claude-sonnet-4-6"
      - "gpt-4o-mini"

  # Full cross-provider comparison (validated only, no duplicates)
  full_comparison:
    description: "All validated models across providers"
    models:
      # Frontier
      - "gpt-5.5"
      - "gpt-5.5-pro"
      - "claude-opus-4-8"
      - "gemini-3.1-pro-preview"
      - "gemini-3-pro-preview"
      # Standard
      - "gpt-4o"
      - "claude-sonnet-4-6"
      - "gemini-2.5-flash"
      # Economy
      - "gpt-5-mini"
      - "gpt-4o-mini"
      - "claude-haiku-4-5-20251001"
      - "gemini-2.0-flash-lite"

